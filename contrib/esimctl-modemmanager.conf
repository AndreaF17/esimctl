<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- ModemManager restricts SIM slot switching to root at the D-Bus level.
     Let administrators (wheel) call it too; ModemManager still checks the
     org.freedesktop.ModemManager1.Device.Control polkit action. -->
<busconfig>
  <policy group="wheel">
    <allow send_destination="org.freedesktop.ModemManager1"
           send_interface="org.freedesktop.ModemManager1.Modem"
           send_member="SetPrimarySimSlot"/>
  </policy>
</busconfig>
